services:
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: day13-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./config/otel/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    container_name: day13-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - TZ=Asia/Ho_Chi_Minh
    ports:
      - "16686:16686" # Jaeger Web UI
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "14268:14268" # Jaeger HTTP collector

  grafana:
    image: grafana/grafana:11.5.2
    container_name: day13-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./config/otel/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/otel/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/otel/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - jaeger
