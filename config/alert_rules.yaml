alerts:
  - name: HighLatencyP95
    severity: critical
    condition: "latency_p95_ms > 3000ms for 5m"
    type: symptom-based
    owner: "Hoàng Danh (Metrics & Alerting)"
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: "error_rate_pct > 2% for 5m"
    type: symptom-based
    owner: "Hoàng Danh (Metrics & Alerting)"
    runbook: docs/alerts.md#alert-2
  - name: HighDailyCost
    severity: warning
    condition: "daily_cost_usd > 2.50 for 1h"
    type: symptom-based
    owner: "Hoàng Danh (Metrics & Alerting)"
    runbook: docs/alerts.md#alert-3
